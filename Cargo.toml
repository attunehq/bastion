[package]
name = "bastion"
version = "0.0.0"
edition = "2024"
description = "Agentic code review: single-concern reviewers as fitness functions, run locally and in CI."
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jssblck/bastion"
keywords = ["code-review", "agents", "ci", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
color-eyre = "0.6.5"
directories = "6.0.0"
# `bastion update` unpacks the release `.tar.gz`. flate2's default `miniz_oxide`
# backend is pure Rust (no zlib/C), so the updater adds no system dependency and
# keeps every cross target building as cleanly as the rest of Bastion does.
flate2 = "1"
globset = "0.4.18"
hex = "0.4.3"
hmac = "0.13.0"
humantime = "2.3.0"
# The GitHub adapter posts the PR comment and per-reviewer check runs over the
# REST API. Default features keep the platform-native TLS (SChannel on Windows,
# OpenSSL on the Linux CI runner) so the build needs no extra C toolchain.
reqwest = { version = "0.13.4", features = ["json"] }
# `bastion update` swaps the running binary for a freshly downloaded release. A
# live executable cannot simply be overwritten on Windows; self-replace
# encapsulates the platform split (an atomic rename on Unix, the
# move-aside-and-clean-up dance on Windows) so the updater does not hand-roll it.
self-replace = "1"
# Compare the running version against the latest release tag in `bastion update`.
# Bastion tags are `vX.Y.Z`; dev builds carry a `git describe` suffix that is not
# a clean release, so the updater parses with semver and treats anything else as a
# development build to reinstall.
semver = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
# `bastion update` unpacks the `bastion` binary out of the release tarball's
# `bastion-<target>/` directory. Pure Rust, so it adds no system dependency.
tar = "0.4"
tokio = { version = "1.52.3", features = [
    "macros",
    "process",
    "rt",
    "time",
    "io-util",
] }
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
# `start_paused` in `#[tokio::test]` (virtual time for the timeout tests) needs
# tokio's test-util feature, which is only required by the test build.
tokio = { version = "1.52.3", features = ["test-util"] }

[build-dependencies]
# Generates the per-build sealing secret in build.rs when BASTION_SEAL_SECRET is
# unset (a dev build). Not needed at runtime, so it is build-only.
getrandom = "0.4"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
inline_always = "deny"
unnecessary_wraps = "deny"
# These three replace the retired `error-handling` and `public-api-docs` LLM
# reviewers: a recoverable error that panics in production and an undocumented
# failure path are mechanical defects, so clippy catches them for free.
# clippy.toml sets allow-unwrap-in-tests / allow-expect-in-tests, so test code
# keeps its idiomatic unwraps.
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "deny"

[profile.release]
# Bastion ships in CI, where download and disk footprint matter more than raw
# throughput (it spends nearly all its wall-clock waiting on agent subprocesses,
# not on its own CPU). So the release profile is tuned for the smallest binary:
# optimize for size ("z" beat "s" here), cross-crate-inline and dead-strip via
# fat LTO with a single codegen unit, and strip symbols. `panic = "abort"` would
# shave a further ~1.6MB but is deliberately left off: the runner relies on
# unwinding to isolate a panicking reviewer (see src/runner/mod.rs) so one crash
# fails that reviewer closed without taking down the rest of the review.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
