name: Security

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # A merge group carrying the exact content a pull request was already checked
  # on reports success without re-running the scans below. See
  # .github/actions/merge-queue-skip.
  merge-queue-skip:
    name: Merge queue skip check
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./.github/actions/merge-queue-skip

  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    needs: merge-queue-skip
    if: needs.merge-queue-skip.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: merge-queue-skip
    if: needs.merge-queue-skip.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.8
        with:
          languages: rust
      - uses: github/codeql-action/autobuild@v4.37.8
      - uses: github/codeql-action/analyze@v4.37.8
