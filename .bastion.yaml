# Bastion reviewer registry.
#
# Reviewers are declarative and static: one concern per reviewer, defined here
# rather than generated by code, so they stay reviewable and produce a stable
# trigger set. Changes to this file should require human review (see
# `bastion github codeowners`). The schema is documented in
# docs/developer-guide/design.md (and, task-first, docs/user-guide/authoring-reviewers.md).
#
# This file lives at the repository root as `.bastion.yaml` (the `.bastion.yml`
# spelling is also honored). A registry can also spread across files: a top-level
# `include:` array merges further registry files, and a reviewer's `prompt` can be
# a `{file: path.md}` reference; this registry is small enough to stay in one
# file with inline prompts. This is the live registry Bastion uses to review its
# own changes, both in the local loop (`bastion review`) and in CI
# (`.github/workflows/bastion.yml`). Every
# reviewer runs on the Codex backend, billed to the maintainer's ChatGPT
# subscription; see the authentication notes in
# docs/developer-guide/github-adapter.md. Adapt it to your repository.
#
# The registry stays small on purpose. An LLM reviewer runs on every matched
# changeset forever, so under a subscription token budget a reviewer earns its
# place with a history of real catches on this repository's PRs, not a plausible
# concern. Both reviewers here clear that bar. `fail-closed-gates` guards the
# safety invariant that gates fail closed, the class of bug where a dirty-worktree
# attestation replay, a carry content-binding hole, or a verdict laundered through
# replay would ship. `user-docs-in-sync` guards the user guide against drifting
# from shipped behavior, where a contradiction can hide a real code bug (as when
# `bastion validate` was documented as rejecting unknown registry fields the
# loader silently accepted).
#
# Concerns a deterministic check or write-time discipline can enforce belong at
# those cheaper layers, not in an LLM reviewer that spends tokens on every
# changeset. Deterministic checks: unwrap/expect discipline and `# Errors` docs
# are clippy lints in Cargo.toml, Unicode-dash policy is `nudge check`, user-guide
# frontmatter and link integrity is tests/user_guide_integrity.rs, the skills
# mirror is tests/skills_mirror.rs, and embedded-asset line endings are
# tests/embedded_asset_eol.rs plus the .gitattributes LF pin. The installers are
# exercised end to end on every platform by .github/workflows/installers.yml.
# Write-time discipline: broad code quality (module boundaries,
# parse-don't-validate, test coverage) is the repo-local skills under
# .agents/skills/, and prose voice is the stop-slop skill applied when the text is
# written.

# Let CI replay a signed `bastion attest` run instead of re-executing
# reviewers; see docs/developer-guide/attestation.md.
attestations: true

# Registry-wide defaults, inherited by every reviewer that does not set the field
# itself (an explicit field on a reviewer wins). Every reviewer below pins
# `backend: codex`, which satisfies the rule that an inherited model needs a
# pinned backend (a model under `backend: any` is a load error). The Codex backend
# forwards `model` as `-m` and `effort` as `model_reasoning_effort`. Medium
# effort is the default; only the trust-boundary gate below opts up to high,
# because it is the one reviewer whose misses ship real bugs. See
# docs/user-guide/authoring-reviewers.md#registry-wide-defaults.
defaults:
  model: gpt-5.5
  effort: medium

reviewers:
  # The gate on Bastion's core safety invariant, and the one reviewer whose
  # misses ship real bugs (a dirty-worktree attestation hole, a seal-time TOCTOU,
  # a carry binding hole), so it runs at high effort. Its trigger is the trust
  # boundary its prompt declares as its scope, not all of src/: the modules where
  # a verdict is produced live, reused, aggregated, sealed, and attested. A change
  # elsewhere cannot violate the invariant, so it should not pay for this
  # reviewer. The runner, backend, commands, and attest entries are directory
  # globs because those modules are split into directories; src/routing.rs pins
  # these globs against the real module paths so a module move cannot silently
  # narrow the trigger.
  - name: fail-closed-gates
    trigger:
      [
        src/runner/**,
        src/backend/**,
        src/verdict.rs,
        src/commands/**,
        src/carry.rs,
        src/seal.rs,
        src/attest/**,
      ]
    mode: gate
    backend: codex
    effort: high
    prompt: |
      Bastion's core safety invariant is that gates fail closed, advisors fail
      open, and every verdict is internally consistent. That invariant is
      established where a verdict is PRODUCED LIVE during a review: the backends
      that parse a reviewer's output, the runner that applies fail-closed (gate)
      and fail-open (advisor) policy to each result, the carry and attestation
      paths that decide when a prior verdict may stand in for a live one, and the
      aggregation that folds the resolved rows into the one merge decision the
      runner persists. That live path is the trust boundary, and it is the scope
      of this reviewer.

      Review only changes to that live-decision path. Block the PR if any of these
      could happen there:

      - A gate (or the aggregate `bastion` gate) is allowed to pass when it cannot
        produce a valid, consistent verdict: a missing, errored, timed-out, or
        crashed reviewer counted as a pass instead of resolving to a block.
      - An inconsistent verdict is trusted rather than rejected where it is
        produced: a `pass` that carries blocking findings, or a `block` with no
        blocking finding.
      - An advisor is allowed to block, or a gate is allowed to fail open.

      Bastion's threat model is aligned contributors, not a forged run file (see
      docs/user-guide/governance.md, "It is not an adversarial security boundary").
      So a surface that REPLAYS or RENDERS a run the runner already decided and
      persisted (for example `bastion github report` or the read-back commands)
      is trusted to reflect that recorded run, and is out of scope here. Do NOT
      require such a surface to re-derive the merge decision from the raw rows, nor
      to prove a persisted run structurally complete, correctly ordered,
      single-sourced, or tally-consistent before it renders the recorded outcome:
      treating the persisted run as untrusted input is explicitly not the model,
      and a missing or extra row in a replayed stream is a runner bug to catch on
      the live path above, not a case a renderer must defend against. The one thing
      a rendering surface must still not do is launder a recorded block, or a
      self-contradictory recorded verdict (a `pass` carrying a blocking finding),
      into a green result, since that is honoring the recorded gate rather than
      re-validating the file.

      Approve when every failure path on the live-decision path resolves to a
      block, advisors never gate, and any rendering surface faithfully reflects the
      recorded decision without turning a block into a pass.

  # The docs gate. Its code-side trigger is the user-visible surface (the CLI
  # tree, the handlers, the registry schema, the verdict/event schema), not all
  # of src/: an internal change to the runner or a backend cannot make the user
  # guide wrong, so it does not trigger a docs review.
  - name: user-docs-in-sync
    trigger:
      [
        src/cli.rs,
        src/commands/**,
        src/config.rs,
        src/reviewer.rs,
        src/verdict.rs,
        src/event.rs,
        docs/user-guide/**,
      ]
    mode: gate
    backend: codex
    prompt: |
      The user guide under docs/user-guide is the end-user documentation for
      Bastion: it describes the CLI a user runs and the policy they author
      (commands and subcommands, their flags and defaults, exit-code semantics,
      the reviewer/registry schema, configuration, and example JSONL event/verdict
      output). It must stay truthful about how the shipped tool behaves. You are
      running in the repository, so read the relevant user-guide chapters and the
      changed code directly.

      This is a gate. Block the PR if either of the following holds; otherwise
      approve it.

      - CONTRADICTION: this change alters user-visible behavior (a command or
        subcommand, a flag or its default, an exit code, the reviewer/registry
        schema, a configuration key, or an event/verdict field a user reads) in a
        way that makes an existing statement or example in docs/user-guide now
        wrong, and that documentation was not updated to match.
      - OMISSION: this change adds new user-visible behavior of those same kinds
        (a new command, subcommand, flag, config key, exit code, or event/verdict
        field a user would invoke or observe) and the user guide was not updated
        to document it.

      Judge only the USER-visible surface. A purely internal change (refactoring,
      renaming private items, performance work, anything a user cannot observe from
      the CLI, its output, or the files they author) does not require a
      user-guide update, so approve it. When the change is user-visible and the
      matching docs were updated (or already cover it), approve. When you block,
      name the exact command, flag, or field and the chapter that must change.
