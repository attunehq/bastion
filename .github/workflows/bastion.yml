name: bastion

# Bastion reviewing Bastion. On every pull request this runs the Bastion GitHub
# Action (the `action.yml` at the repository root), which downloads a published
# `bastion` release binary, runs `bastion review` over the changeset, posts the
# results with `bastion github report` (a sticky PR comment, one check run per
# reviewer, and the aggregate `bastion` check), uploads the run artifact, and
# fails on a blocked review. Branch protection on `main` requires the
# `bastion review` check so a blocking gate stops the merge.
#
# The action is consumed from the PR's own checkout (`uses: ./`) so action
# changes take effect in the same PR; `action.yml` is a CODEOWNERS-protected
# path like this workflow. The reviewer *engine* stays outside the PR's reach:
# `uses: ./` carries no release ref, so the action installs the *latest*
# published release rather than a binary built from the PR's own sources.
# Building from the PR would let a change edit the very engine that judges it
# (neutering a reviewer or forcing a pass); releases are maintainer-cut tags,
# so the engine is only ever a maintainer-published artifact, and it picks up
# improvements with no per-PR pin bump. Reviewer *policy* (.bastion.yaml) is
# still read from the checkout so prompt and trigger changes take effect in the
# same PR; those paths are CODEOWNERS-protected too.
#
# This is the concrete, self-hosted adapter described in
# docs/developer-guide/github-adapter.md. The job's pass/fail remains the gate.

on:
  pull_request:
  # Merge queue runs report this check without reviewing; see the job condition.
  merge_group:

# Read the diff and fail the job, and write the surfaces `bastion github report`
# posts after the review: the sticky PR comment (`pull-requests: write`) and the
# per-reviewer and aggregate check runs (`checks: write`). `actions: read` lets
# the action's restore step list and download this branch's prior run artifact.
permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

# One in-flight review per PR; a new push cancels the previous run.
concurrency:
  group: bastion-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

jobs:
  review:
    name: bastion review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Whether the optional dedicated app is fully configured. The id and the private
    # key are one credential, so this is true only when both are set: a half-set repo
    # then falls back cleanly instead of running the mint step and failing it. Computed
    # here because the mint step's `if:` can read `env` but not `secrets`.
    env:
      HAS_BASTION_APP: ${{ secrets.BASTION_APP_ID != '' && secrets.BASTION_APP_PRIVATE_KEY != '' }}
    # The Muse API key lives in an Actions secret, and GitHub does not share
    # secrets with workflows triggered by fork PRs. We also will not run an
    # agentic backend over untrusted code. So this runs for same-repo PRs only; a
    # maintainer reviews a fork PR by pushing its branch to a trusted branch in
    # this repo.
    #
    # The review never runs in the merge queue. Reviewers are paid agents, and
    # the queue would spend a second set of tokens on content a green PR review
    # already covered. The workflow still triggers on `merge_group` so this job
    # reports as skipped, which a required status check accepts; without the
    # trigger the check would never report and the queue would stall. The
    # tradeoff is that a merge group combining several PRs merges on the
    # per-PR verdicts rather than a review of the combined result.
    if: |
      github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the base branch resolves for the changeset diff and so
          # the reviewer can run `git diff <base>` over the working tree.
          fetch-depth: 0
          # The PR head, not the default merge commit: the review diffs the PR head
          # against the base, mirroring what the author's local `bastion review` saw.
          # Attestation replay needs this too, since it binds to the head tree the
          # author attested; the merge-commit view would never match it.
          ref: ${{ github.event.pull_request.head.sha }}

      # The backend CLI is the consumer's half of the action's contract: install
      # and authenticate it before the action runs, exactly as a contributor
      # would locally. The Muse launcher goes on PATH as `muse` so it resolves by
      # name with no BASTION_MUSE_BIN override: a backend-path override marks the
      # run's seal with a test seam, and a seam-tainted seal is disqualified from
      # being carried forward on the next push (and from attestation). The
      # launcher fetches the pinned CLI binary on first run.
      - name: Install the Muse Code CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://api.meta.ai/muse-launcher.sh -o "$HOME/.local/bin/muse"
          chmod +x "$HOME/.local/bin/muse"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/muse" --version

      - name: Mint a dedicated app token for reporting
        id: app-token
        # Optional, and only when a dedicated Bastion GitHub App is configured (the
        # BASTION_APP_ID / BASTION_APP_PRIVATE_KEY secrets). Posting the check runs
        # under a distinct app gives them their own check suite, so the PR renders
        # them under the app's name (e.g. "Bastion / fail-closed-gates"). Without a
        # dedicated app the action's report step falls back to the default
        # GITHUB_TOKEN, which still posts but, because every workflow shares the one
        # github-actions app identity, GitHub buckets the API-created check runs
        # into whichever of this commit's check suites it picks (often a sibling
        # workflow like "Security"). See docs/developer-guide/github-adapter.md.
        if: env.HAS_BASTION_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BASTION_APP_ID }}
          private-key: ${{ secrets.BASTION_APP_PRIVATE_KEY }}

      # Fetches the attestation notes ref, restores this branch's prior run
      # (prior-finding recall and incremental carry), reviews, uploads the run
      # artifact, reports to the PR, and fails on a blocked review, in that
      # order, so the comment and checks land even when the gate blocks.
      - name: Review and report
        uses: ./
        # Muse Code authenticates from META_API_KEY (API billing) when set, so the
        # reviewers bill to the repository's key rather than a contributor's
        # account. The key lives in the META_AI_API_KEY Actions secret; a missing
        # or empty key makes every gate fail closed rather than silently pass.
        env:
          META_API_KEY: ${{ secrets.META_AI_API_KEY }}
        with:
          report-token: ${{ steps.app-token.outputs.token || github.token }}
